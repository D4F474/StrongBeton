<div class="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-md rounded-xl">

  <!-- Заглавие -->
  <h2 class="text-2xl font-semibold text-gray-800 mb-6">Account Settings</h2>

  <!-- Смяна на аватар -->
  <div class="mb-10">
    <h3 class="text-lg font-medium text-gray-700 mb-4">Profile Avatar</h3>

    <div class="flex items-center gap-6">

      <!-- Preview контейнер (статично изображение) -->
      <div class="w-24 h-24 rounded-full overflow-hidden border border-gray-300 shadow-sm bg-gray-100">
        <img 
          [src]="image.photoUrl"
          alt="Avatar preview"
          class="w-full h-full object-cover">
      </div>

      <!-- File input -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Upload new avatar</label>

        <input type="file"
               accept="image/*"
                (change)="onFileSelected($event)"
               class="block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg
                      file:border-0 file:text-sm file:font-semibold 
                      file:bg-blue-600 file:text-white
                      hover:file:bg-blue-700 cursor-pointer" />
        <p class="text-xs text-gray-500 mt-2">
          Recommended: square image (300×300px)
        </p>
      </div>
    </div>
    <button (click)="addPhotoProfile()"> Add Photo</button>
  </div>

  <hr class="my-6">

  <!-- Основна информация -->
  <div class="mb-8">
    <h3 class="text-lg font-medium text-gray-700 mb-4">Profile Information</h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">First Name</label>
        <input type="text"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Last Name</label>
        <input type="text"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">City</label>
        <input type="text"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Birthdate</label>
        <input type="date"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </div>

  <hr class="my-6">

  <!-- Парола -->
  <div class="mb-8">
    <h3 class="text-lg font-medium text-gray-700 mb-4">Change Password</h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Current Password</label>
        <input type="password"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">New Password</label>
        <input type="password"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-600 mb-1">Repeat New Password</label>
        <input type="password"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </div>

  <hr class="my-6">

  <!-- Danger Zone -->
  <div class="mb-6">
    <h3 class="text-lg font-medium text-gray-700 mb-4">Danger Zone</h3>

    <button class="px-6 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700">
      Delete Account
    </button>
  </div>

  <!-- Save Button -->
  <div class="mt-8">
    <button class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 shadow">
      Save Changes
    </button>
  </div>
</div>
