<div class="min-h-screen flex items-center justify-center bg-gray-50 p-6">
  <div class="bg-white shadow-md rounded-2xl w-full max-w-sm p-8">
    <h3 class="text-2xl font-bold text-center text-[#1E3A8A] mb-6">Вход</h3>

    <form [formGroup]="logInForm!" (ngSubmit)="onSubmit()" class="space-y-5">
      <div formGroupName="user" class="space-y-5">

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          />
          <div
            *ngIf="email?.invalid && (email?.dirty || email?.touched)"
            class="text-red-500 text-sm mt-1"
          >
           Please Enter Valid Email! 
          </div>
        </div>

        <!-- Парола -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          />
          <div
            *ngIf="password?.invalid && (password?.dirty || password?.touched)"
            class="text-red-500 text-sm mt-1"
          >
          Please Enter Valid Password! 
          </div>
        </div>

        <!-- Бутон за вход -->
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow transition"
        >
         Sign In 
        </button>
      </div>
    </form>

    <!-- Линк за регистрация -->
    <div class="text-center mt-6">
      <a
        routerLink="/register-form"
        class="text-blue-600 hover:text-blue-700 font-medium transition"
      >
