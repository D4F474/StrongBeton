<div class="p-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
    <h1 class="text-3xl font-bold text-[#1E3A8A]">Workouts:</h1>
    <div class="w-full sm:w-auto">
      <app-search></app-search>
    </div>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto bg-white rounded-2xl shadow-sm border border-gray-100">
    <table class="min-w-full text-sm text-gray-700">
      <thead class="bg-gray-50 text-left text-gray-600 uppercase text-xs">
        <tr>
          <th class="py-3 px-4 font-medium">#</th>
          <th class="py-3 px-4 font-medium">Name of Workout</th>
          <th class="py-3 px-4 font-medium text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let workout of workouts | keyvalue; let i = index" class="border-t hover:bg-gray-50 transition">
          <td class="py-3 px-4 font-medium text-gray-800">{{ i + 1 }}</td>
          <td class="py-3 px-4">
            <a (click)="openWorkoutDialog(workout.key)" class="text-blue-600 hover:underline font-medium">
              {{ workout.key }}
            </a>
          </td>
          <td class="py-3 px-4 flex justify-center gap-3">
            <button 
              class="text-gray-600 hover:text-blue-600 transition text-lg" 
              title="Стартирай тренировка">
              <i class="fa-regular fa-circle-play"></i>
            </button>
            <button 
              (click)="openWorkoutDialog(workout.key)" 
              class="text-gray-600 hover:text-blue-600 transition text-lg"
              title="Виж детайли">
              <i class="fa-solid fa-circle-info"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Button -->
  <div class="mt-6">
    <button 
      (click)="openAddWorkoutDialog()" 
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-lg shadow transition w-full sm:w-auto justify-center">
      <i class="fa-solid fa-plus"></i>
     Add Workout 
    </button>
  </div>
