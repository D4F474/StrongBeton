<aside class="sb-sidebar sticky top-16 flex min-h-[calc(100vh-4rem)] flex-col border-r p-4">
  <div>
    <a routerLink="/app/home" class="block border-b border-[#E5E7EB] pb-4">
      <div class="sb-logo-poster h-20">
        <img
          *ngIf="logoAvailable"
          src="assets/strongbeton-logo.png"
          alt="StrongBeton logo"
          class="object-top"
          (error)="hideLogo()"
        />

        <div
          *ngIf="!logoAvailable"
          class="flex h-full items-center justify-center text-3xl font-black text-[#F59E0B]"
        >
          SB
        </div>
      </div>

      <div class="mt-3">
        <div class="text-base font-black uppercase leading-none text-[#172033]">
          StrongBeton
        </div>
        <div class="mt-1 text-[10px] font-black uppercase tracking-[0.1em] text-[#2563EB]">
          Bulgarian Strength Club
        </div>
      </div>
    </a>

    <div class="mt-5 grid grid-cols-2 gap-3">
      <div class="sb-stat-badge">
        <div class="text-2xl font-black text-[#F59E0B]">742</div>
        <div class="text-[10px] font-black text-[#6B7280]">Score</div>
      </div>

      <div class="sb-stat-badge">
        <div class="text-2xl font-black text-[#22C55E]">6</div>
        <div class="text-[10px] font-black text-[#6B7280]">Streak</div>
      </div>
    </div>

    <nav class="mt-6 space-y-1">
      <a routerLink="/app/home" routerLinkActive="is-active" class="sb-sidebar-item">
        Home
      </a>

      <a routerLink="/app/workout" routerLinkActive="is-active" class="sb-sidebar-item">
        Workouts
      </a>

      <a routerLink="/app/progress" routerLinkActive="is-active" class="sb-sidebar-item">
        Stats
      </a>

      <a routerLink="/app/clans" routerLinkActive="is-active" class="sb-sidebar-item">
        Clans
      </a>

      <a routerLink="/app/coach" routerLinkActive="is-active" class="sb-sidebar-item">
        Coach
      </a>

      <a routerLink="/app/profile" routerLinkActive="is-active" class="sb-sidebar-item">
        Profile
      </a>
    </nav>
  </div>

  <div class="mt-auto space-y-1 border-t border-[#E5E7EB] pt-4">
    <a routerLink="/app/settings" routerLinkActive="is-active" class="sb-sidebar-item">
      Settings
    </a>

    <a routerLink="/login" class="sb-sidebar-item text-[#6B7280] hover:border-l-[#2563EB] hover:bg-[#DBEAFE]">
      Logout
    </a>
  </div>
</aside>
