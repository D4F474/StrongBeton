<article class="sb-panel p-5">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[#E5E7EB] pb-4">
    <div>
      <h2 class="text-sm font-black uppercase tracking-wide text-[#172033]">
        Активност на клана
      </h2>

      <p class="mt-1 text-xs font-bold uppercase tracking-wide text-[#6B7280]">
        Последни приноси от тренировки
      </p>
    </div>

    <button
      type="button"
      (click)="loadActivity()"
      class="sb-secondary-btn h-10 px-4 text-xs"
    >
      Обнови
    </button>
  </div>

  <div *ngIf="!loaded" class="mt-4 grid gap-3">
    <div class="h-16 animate-pulse border border-[#E5E7EB] bg-[#F3F4F6]"></div>
    <div class="h-16 animate-pulse border border-[#E5E7EB] bg-[#F3F4F6]"></div>
    <div class="h-16 animate-pulse border border-[#E5E7EB] bg-[#F3F4F6]"></div>
  </div>

  <div *ngIf="loaded && error" class="mt-4 border border-red-200 bg-red-50 p-4">
    <p class="text-xs font-black uppercase text-red-600">
      {{ error }}
    </p>
  </div>

  <div *ngIf="loaded && !error && hasActivity" class="mt-4 grid gap-3">
    <div
      *ngFor="let contribution of contributions; trackBy: trackByIndex"
      class="flex items-center justify-between border border-[#E5E7EB] bg-white p-4"
    >
      <div>
        <div class="text-sm font-black uppercase text-[#172033]">
          {{ contribution.username || 'Атлет' }}
        </div>

        <div class="mt-1 text-xs font-black uppercase text-[#6B7280]">
          {{ formatDate(contribution.date) }}
        </div>
      </div>

      <div class="text-right">
        <div class="text-lg font-black text-[#F59E0B]">
          +{{ contribution.points }} т.
        </div>

        <div class="text-[10px] font-black uppercase text-[#22C55E]">
          тренировката е завършена
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="loaded && !error && !hasActivity"
    class="mt-4 rounded-[1.5rem] border border-dashed border-[#E5E7EB] bg-white p-5"
  >
    <p class="text-sm font-black uppercase text-[#6B7280]">
      Все още няма активност.
    </p>

    <p class="mt-2 text-sm font-bold text-[#6B7280]">
      Завърши тренировка и приносът ще се появи тук.
    </p>
  </div>
</article>
