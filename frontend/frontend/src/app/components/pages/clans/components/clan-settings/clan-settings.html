<div
  *ngIf="open"
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/50 p-4"
>
  <section class="w-full max-w-xl border border-[#172033] bg-white shadow-2xl">
    <header class="flex items-start justify-between border-b border-[#172033] p-5">
      <div>
        <p class="text-xs font-black uppercase tracking-[0.18em] text-[#2563EB]">
          Clan Settings
        </p>

        <h2 class="mt-1 text-2xl font-black uppercase text-[#172033]">
          Edit clan
        </h2>
      </div>

      <button
        type="button"
        (click)="close()"
        class="sb-secondary-btn h-12 w-12"
      >
        X
      </button>
    </header>

    <div class="grid gap-4 p-5">
      <div>
        <label class="text-xs font-black uppercase tracking-wide text-[#6B7280]">
          Clan name
        </label>

        <input
          type="text"
          [(ngModel)]="name"
          class="mt-2 w-full border border-[#172033] px-4 py-3 text-sm font-black uppercase text-[#172033] outline-none focus:border-[#F59E0B]"
        />
      </div>

      <div>
        <label class="text-xs font-black uppercase tracking-wide text-[#6B7280]">
          Description
        </label>

        <textarea
          rows="4"
          [(ngModel)]="description"
          class="mt-2 w-full border border-[#172033] px-4 py-3 text-sm font-bold text-[#172033] outline-none focus:border-[#F59E0B]"
        ></textarea>
      </div>

      <label class="flex items-center gap-3 border border-[#E5E7EB] bg-[#F9FAFB] p-4">
        <input
          type="checkbox"
          [(ngModel)]="invite"
        />

        <span class="text-xs font-black uppercase tracking-wide text-[#6B7280]">
          Invite only clan
        </span>
      </label>

      <p class="text-xs font-bold uppercase leading-relaxed text-[#6B7280]">
        If invite only is enabled, new users will join as pending members and must be accepted by clan leadership.
      </p>
    </div>

    <footer class="flex gap-3 border-t border-[#172033] p-5">
      <button
        type="button"
        (click)="close()"
        [disabled]="actionLoading"
        class="sb-secondary-btn h-12 flex-1 text-xs"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="save()"
        [disabled]="actionLoading || !name.trim()"
        class="sb-workout-btn h-12 flex-1 text-xs disabled:opacity-40"
      >
        {{ actionLoading ? 'Saving...' : 'Save Settings' }}
      </button>
    </footer>
  </section>
</div>
