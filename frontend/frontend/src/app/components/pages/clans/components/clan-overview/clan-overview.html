<div class="grid grid-cols-2 gap-3 md:gap-4 xl:grid-cols-4">
  <article class="sb-panel p-4 md:p-5">
    <div class="text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:text-xs">
      Точки на клана
    </div>

    <div class="mt-3 text-3xl font-black text-[#F59E0B] md:mt-4 md:text-5xl">
      {{ clanPoints | number: '1.0-0' }}
    </div>

    <div class="mt-2 text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:mt-3 md:text-xs">
      спечелени от завършени тренировки
    </div>
  </article>

  <article class="sb-panel p-4 md:p-5">
    <div class="text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:text-xs">
      Членове
    </div>

    <div class="mt-3 text-3xl font-black text-[#172033] md:mt-4 md:text-5xl">
      {{ clan?.members?.length }}
    </div>

    <div class="mt-2 text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:mt-3 md:text-xs">
      максимум 32 атлета
    </div>
  </article>

  <article class="sb-panel p-4 md:p-5">
    <div class="text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:text-xs">
      Лига
    </div>

    <div class="mt-3 text-xl font-black uppercase text-[#2563EB] md:mt-4 md:text-3xl">
      {{ clanLeague }}
    </div>

    <div class="mt-2 text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:mt-3 md:text-xs">
      текуща дивизия
    </div>
  </article>

  <article class="sb-panel p-4 md:p-5">
    <div class="text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:text-xs">
      Достъп
    </div>

    <div class="mt-3 text-xl font-black uppercase text-[#22C55E] md:mt-4 md:text-3xl">
      {{ inviteMode }}
    </div>

    <div class="mt-2 text-[10px] font-black uppercase tracking-wide text-[#6B7280] md:mt-3 md:text-xs">
      режим за присъединяване към клана
    </div>
  </article>
</div>
