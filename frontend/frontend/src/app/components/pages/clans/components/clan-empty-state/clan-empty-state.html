<div class="grid gap-4 xl:grid-cols-2">
  <article class="sb-panel p-5 md:p-6">
    <p class="text-xs font-black uppercase tracking-[0.16em] text-[#6B7280]">
      Създай клан
    </p>

    <h2 class="mt-2 text-2xl font-black uppercase text-[#172033]">
      Създай свой собствен отбор.
    </h2>

    <p class="mt-2 text-sm font-bold text-[#6B7280]">
      Създай силов отбор и стани негов лидер.
    </p>

    <div class="mt-5 grid gap-3">
      <input
        [(ngModel)]="createName"
        type="text"
        placeholder="Име на клана"
        class="rounded-2xl border border-[#E5E7EB] bg-white px-4 py-3 text-sm font-bold text-[#172033] outline-none"
      />

      <textarea
        [(ngModel)]="createDescription"
        rows="3"
        placeholder="Описание"
        class="rounded-2xl border border-[#E5E7EB] bg-white px-4 py-3 text-sm font-bold text-[#172033] outline-none"
      ></textarea>

      <label class="flex items-center gap-3 text-sm font-black uppercase text-[#6B7280]">
        <input
          [(ngModel)]="createInviteOnly"
          type="checkbox"
        />
        Само с покана
      </label>

      <button
        type="button"
        class="sb-workout-btn h-14 px-6 text-lg"
        [disabled]="actionLoading || !createName.trim()"
        (click)="createClan()"
      >
        {{ actionLoading ? 'Създаване...' : 'Създай клан' }}
      </button>
    </div>
  </article>

  <article class="sb-panel p-5 md:p-6">
    <p class="text-xs font-black uppercase tracking-[0.16em] text-[#6B7280]">
      Присъедини се към клан
    </p>

    <h2 class="mt-2 text-2xl font-black uppercase text-[#172033]">
      Влез в съществуващ клан.
    </h2>

    <p class="mt-2 text-sm font-bold text-[#6B7280]">
      Използвай ID на клан или се присъедини от класацията по-долу.
    </p>

    <div class="mt-5 grid gap-3">
      <input
        [(ngModel)]="joinClanId"
        type="number"
        placeholder="ID на клана"
        class="rounded-2xl border border-[#E5E7EB] bg-white px-4 py-3 text-sm font-bold text-[#172033] outline-none"
      />

      <button
        type="button"
        class="sb-secondary-btn h-14 px-6 text-sm"
        [disabled]="actionLoading || !joinClanId"
        (click)="joinClan()"
      >
        {{ actionLoading ? 'Присъединяване...' : 'Присъедини се' }}
      </button>
    </div>
  </article>
</div>
