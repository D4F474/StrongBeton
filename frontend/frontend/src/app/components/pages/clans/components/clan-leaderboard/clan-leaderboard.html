<article class="sb-panel p-5">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[#E5E7EB] pb-4">
    <h2 class="text-sm font-black uppercase tracking-wide text-[#172033]">
      Глобална класация на клановете
    </h2>

    <span class="text-xs font-black uppercase text-[#6B7280]">
      Топ кланове
    </span>
  </div>

  <div *ngIf="topClans.length > 0; else emptyLeaderboard" class="mt-4 grid gap-3 md:grid-cols-3">
    <div
      *ngFor="let clan of topClans; let i = index; trackBy: trackByIndex"
      class="sb-card p-4"
    >
      <div class="text-xs font-black uppercase text-[#6B7280]">
        Позиция #{{ i + 1 }}
      </div>

      <div class="mt-2 truncate text-xl font-black uppercase text-[#172033]">
        {{ clan.clanName || 'Безименен клан' }}
      </div>

      <div class="mt-3 text-sm font-black text-[#F59E0B]">
        {{ clan.teamScore || 0 }} отборен резултат
      </div>

      <div class="mt-2 text-xs font-black uppercase text-[#6B7280]">
        {{ clan.totalPoints || 0 }} т. · {{ clan.totalMembers || 0 }} членове
      </div>

      <button
        *ngIf="!hasClan"
        type="button"
        class="sb-secondary-btn mt-4 h-11 w-full text-xs"
        [disabled]="actionLoading"
        (click)="joinClan(clan.clanId)"
      >
        {{ actionLoading ? 'Присъединяване...' : 'Присъедини се' }}
      </button>
    </div>
  </div>

  <ng-template #emptyLeaderboard>
    <div class="mt-4 rounded-[1.5rem] border border-dashed border-[#E5E7EB] bg-white p-5">
      <p class="text-sm font-black uppercase text-[#6B7280]">
        Все още няма кланове в класацията.
      </p>

      <p class="mt-2 text-sm font-bold text-[#6B7280]">
        Създай първия клан и завладей класацията.
      </p>
    </div>
  </ng-template>
</article>
