<section class="mx-auto max-w-5xl space-y-6">
  <div class="border border-[#E5E7EB] bg-[#FFFFFF] p-6 shadow-[5px_5px_0_#172033]">
    <p class="text-xs font-black uppercase tracking-[0.25em] text-[#2563EB]">Settings</p>
    <h1 class="mt-4 text-3xl font-black uppercase md:text-5xl">Training Defaults</h1>
    <p class="mt-4 max-w-2xl text-[#6B7280]">
      Minimal app preferences for the demo UI. These controls are local only.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
    <article class="border border-[#E5E7EB] bg-[#FFFFFF] p-5 shadow-[4px_4px_0_#172033]">
      <h2 class="text-sm font-black uppercase tracking-wide">Workout</h2>

      <label class="mt-5 block text-xs font-black uppercase text-[#6B7280]">
        Units
        <select
          [(ngModel)]="units"
          class="mt-2 w-full border border-[#E5E7EB] bg-[#F7FAFC] px-3 py-3 font-black uppercase text-[#172033] outline-none focus:border-[#2563EB]"
        >
          <option value="kg">Kilograms</option>
          <option value="lb">Pounds</option>
        </select>
      </label>

      <label class="mt-5 block text-xs font-black uppercase text-[#6B7280]">
        Rest Timer
        <input
          type="number"
          [(ngModel)]="restTimer"
          class="mt-2 w-full border border-[#E5E7EB] bg-[#172033] px-3 py-3 font-black text-[#172033] outline-none focus:border-[#2563EB]"
        />
      </label>
    </article>

    <article class="border border-[#E5E7EB] bg-[#FFFFFF] p-5 shadow-[4px_4px_0_#172033]">
      <h2 class="text-sm font-black uppercase tracking-wide">Profile</h2>

      <label class="mt-5 block text-xs font-black uppercase text-[#6B7280]">
        Visibility
        <select
          [(ngModel)]="visibility"
          class="mt-2 w-full border border-[#E5E7EB] bg-[#F7FAFC] px-3 py-3 font-black uppercase text-[#172033] outline-none focus:border-[#2563EB]"
        >
          <option value="public">Public</option>
          <option value="clan">Clan Only</option>
          <option value="private">Private</option>
        </select>
      </label>

      <div class="mt-5 space-y-3">
        <label class="flex items-center justify-between gap-4 border border-[#E5E7EB] bg-[#F7FAFC] p-4">
          <span class="text-xs font-black uppercase text-[#172033]">Notifications</span>
          <input type="checkbox" [(ngModel)]="notifications" class="accent-[#2563EB]" />
        </label>

        <label class="flex items-center justify-between gap-4 border border-[#E5E7EB] bg-[#F7FAFC] p-4">
          <span class="text-xs font-black uppercase text-[#172033]">Weekly Digest</span>
          <input type="checkbox" [(ngModel)]="weeklyDigest" class="accent-[#2563EB]" />
        </label>
      </div>
    </article>
  </div>
</section>
