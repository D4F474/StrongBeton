<div
  *ngIf="isWorkoutFinished"
  class="mb-4 border border-[#22C55E] bg-green-50 p-3 text-xs font-black uppercase text-[#15803D]"
>
  Тази тренировка е приключена. Можеш само да я преглеждаш.
</div>

<div
  *ngIf="exerciseMutationError"
  class="mb-4 border border-red-200 bg-red-50 p-3 text-xs font-bold uppercase text-red-700"
>
  {{ exerciseMutationError }}
</div>

<div *ngIf="workoutDetails.length === 0" class="py-8 text-center border-y border-[#172033]">
  <p class="text-sm font-black uppercase text-[#6B7280]">
    {{ canEditWorkout ? 'Няма упражнения. Добави първото.' : 'Няма записани упражнения.' }}
  </p>
</div>

<div
  *ngFor="let detail of workoutDetails"
  (click)="selectDetail.emit(detail)"
  class="cursor-pointer border-b border-[#172033] p-4 hover:bg-[#FEF3C7] flex justify-between items-center gap-4"
>
  <div class="flex min-w-0 items-center gap-4">
    <img
      [src]="getExerciseImageUrl(detail.exercise)"
      [alt]="detail.exercise.name"
      (error)="hideBrokenImage($event)"
      class="h-16 w-16 shrink-0 border border-[#172033] object-cover"
      loading="lazy"
    />

    <div class="min-w-0">
      <div class="font-black uppercase">
        {{ detail.exercise.name }}
      </div>

      <div class="text-xs text-[#6B7280]">
        {{ detail.exercise.muscleGroup }}
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <button
      *ngIf="canEditWorkout"
      type="button"
      (click)="onDelete(detail, $event)"
      [disabled]="deletingWorkoutDetailId === detail.id"
      class="border border-red-600 px-3 py-2 text-[10px] font-black uppercase tracking-wide text-red-700 hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-40"
    >
      {{ deletingWorkoutDetailId === detail.id ? 'Триене...' : 'Изтрий' }}
    </button>

    <span class="text-xs font-black uppercase text-[#F59E0B]">
      →
    </span>
  </div>
</div>
