<header class="border-b border-[#172033] pb-4 mb-6">
  <p class="text-[10px] font-black uppercase tracking-[0.16em] text-[#6B7280]">
    Workout Mode
  </p>

  <h1 class="mt-1 text-xl font-black uppercase md:text-3xl">
    Choose workout
  </h1>
</header>

<div class="mb-6">
  <label class="text-xs font-black uppercase tracking-wide text-[#6B7280]">
    Workout name
  </label>

  <form class="mt-2 flex gap-3" (ngSubmit)="submitWorkout()">
    <input
      type="text"
      name="newWorkoutName"
      [(ngModel)]="newWorkoutName"
      placeholder="e.g. Pull, Push, Legs..."
      class="flex-1 border border-[#172033] px-4 py-3 font-black uppercase text-sm focus:outline-none focus:border-[#F59E0B]"
    />

    <button
      type="submit"
      [disabled]="isCreatingWorkout || !newWorkoutName.trim()"
      class="sb-primary-btn h-12 px-6 text-sm disabled:cursor-not-allowed disabled:opacity-40"
    >
      {{ isCreatingWorkout ? 'Creating...' : '+ New' }}
    </button>
  </form>

  <div
    *ngIf="createWorkoutError"
    class="mt-3 border border-red-200 bg-red-50 p-3 text-xs font-bold uppercase text-red-700"
  >
    {{ createWorkoutError }}
  </div>

  <div *ngIf="suggestedWorkoutNames.length > 0" class="border border-t-0 border-[#172033]">
    <div
      *ngFor="let name of suggestedWorkoutNames"
      class="border-b border-[#E5E7EB] last:border-0"
    >
      <div class="px-4 py-2 text-xs font-black uppercase text-[#6B7280] bg-[#F9FAFB]">
        {{ name }}
      </div>

      <div
        *ngFor="let workout of workoutGroups[name]"
        (click)="selectWorkout.emit(workout)"
        class="cursor-pointer px-4 py-3 hover:bg-[#FEF3C7] flex justify-between items-center gap-4"
      >
        <span class="font-black uppercase text-sm">
          {{ workout.workoutName }}
        </span>

        <span class="text-xs text-[#6B7280]">
          {{ workout.date }} - {{ workout.status }}
        </span>
      </div>
    </div>
  </div>
</div>

<div *ngFor="let name of workoutNames" class="mb-4">
  <h3 class="text-[10px] font-black uppercase tracking-[0.16em] text-[#6B7280] mb-2">
    {{ name }}
  </h3>

  <div
    *ngFor="let workout of workoutGroups[name]"
    (click)="selectWorkout.emit(workout)"
    class="cursor-pointer border-b border-[#172033] p-4 hover:bg-[#FEF3C7] flex justify-between items-center gap-4"
  >
    <span class="font-black uppercase">
      {{ workout.workoutName }}
    </span>

    <span class="text-xs text-[#6B7280]">
      {{ workout.date }} - {{ workout.status }}
    </span>
  </div>
</div>
