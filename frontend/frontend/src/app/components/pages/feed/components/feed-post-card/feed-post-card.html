<article class="sb-panel overflow-hidden p-5">
  <header class="flex flex-wrap items-start justify-between gap-3 border-b border-[#E5E7EB] pb-4">
    <div>
      <p class="text-xs font-black uppercase tracking-[0.18em] text-[#2563EB]">
        {{ getPostType() }}
      </p>

      <h2 class="mt-1 text-xl font-black uppercase text-[#172033]">
        {{ getAuthorName() }}
      </h2>

      <p class="mt-1 text-xs font-bold uppercase text-[#6B7280]">
        {{ formatDate(post.createdAt) }}
      </p>
    </div>

    <button
      *ngIf="canDeletePost()"
      type="button"
      (click)="delete.emit(post)"
      [disabled]="loading"
      class="h-10 border border-red-300 bg-red-50 px-4 text-xs font-black uppercase text-red-600 disabled:opacity-40"
    >
      Delete
    </button>
  </header>

  <p class="mt-4 whitespace-pre-line text-sm font-bold leading-relaxed text-[#172033]">
    {{ post.content }}
  </p>

  <div class="mt-5 flex flex-wrap items-center gap-3 border-t border-[#E5E7EB] pt-4">
    <button
  type="button"
  (click)="like.emit(post)"
  [disabled]="loading"
  class="sb-secondary-btn h-11 px-5 text-xs disabled:opacity-40"
  [class.border-[#2563EB]]="isLikedByCurrentUser()"
  [class.bg-[#EFF6FF]]="isLikedByCurrentUser()"
  [class.text-[#2563EB]]="isLikedByCurrentUser()"
>
  {{ isLikedByCurrentUser() ? 'Liked' : 'Like' }} · {{ getLikesCount() }}
</button>

    <span class="text-xs font-black uppercase text-[#6B7280]">
      {{ getCommentsCount() }} comments
    </span>
  </div>

  <div *ngIf="getComments().length > 0" class="mt-4 grid gap-2">
    <div
      *ngFor="let comment of getComments(); trackBy: trackByIndex"
      class="border border-[#E5E7EB] bg-[#F9FAFB] p-3"
    >
      <p class="text-xs font-black uppercase text-[#6B7280]">
        {{ getCommentAuthor(comment) }}
      </p>

      <p class="mt-1 text-sm font-bold text-[#172033]">
        {{ comment.content }}
      </p>
    </div>
  </div>

  <div *ngIf="post.id" class="mt-4 flex gap-2">
    <input
      type="text"
      [(ngModel)]="commentContent"
      placeholder="Write a comment..."
      class="min-w-0 flex-1 border border-[#172033] px-4 py-3 text-sm font-bold text-[#172033] outline-none focus:border-[#F59E0B]"
    />

    <button
      type="button"
      (click)="submitComment()"
      [disabled]="loading || !commentContent.trim()"
      class="sb-workout-btn h-12 px-5 text-xs disabled:opacity-40"
    >
      Send
    </button>
  </div>
</article>
