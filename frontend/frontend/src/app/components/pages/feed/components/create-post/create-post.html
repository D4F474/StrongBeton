<p>create-post works!</p>
<article class="sb-panel p-5">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[#E5E7EB] pb-4">
    <div>
      <p class="text-xs font-black uppercase tracking-[0.18em] text-[#2563EB]">
        Create Post
      </p>

      <h2 class="mt-1 text-2xl font-black uppercase text-[#172033]">
        Say something strong
      </h2>
    </div>

    <span class="text-xs font-black uppercase text-[#6B7280]">
      TEXT POST
    </span>
  </div>

  <textarea
    rows="4"
    [(ngModel)]="content"
    placeholder="What did you train today?"
    class="mt-4 w-full border border-[#172033] px-4 py-3 text-sm font-bold text-[#172033] outline-none focus:border-[#F59E0B]"
  ></textarea>

  <div class="mt-4 flex justify-end">
    <button
      type="button"
      (click)="submit()"
      [disabled]="loading || !content.trim()"
      class="sb-workout-btn h-12 px-6 text-xs disabled:opacity-40"
    >
      {{ loading ? 'Posting...' : 'Post' }}
    </button>
  </div>
</article>
