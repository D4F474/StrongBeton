<section *ngIf="!pageReady" class="space-y-4 md:space-y-5">
  <div class="sb-panel p-4 md:p-8 animate-pulse">
    <div class="h-4 w-48 rounded bg-[#E5E7EB]"></div>
    <div class="mt-4 h-12 w-72 rounded bg-[#E5E7EB]"></div>
    <div class="mt-4 h-4 w-full max-w-xl rounded bg-[#E5E7EB]"></div>
  </div>

  <div class="sb-panel h-40 animate-pulse bg-[#F3F4F6]"></div>
  <div class="sb-panel h-40 animate-pulse bg-[#F3F4F6]"></div>
</section>

<section *ngIf="pageReady" class="space-y-4 md:space-y-5">
  <div class="sb-panel overflow-hidden p-4 md:p-8">
    <div class="grid gap-5 xl:grid-cols-[1fr_320px] xl:items-end">
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.16em] text-[#2563EB] md:text-xs md:tracking-[0.25em]">
          StrongBeton Feed
        </p>

        <h1 class="mt-2 text-3xl font-black uppercase leading-none text-[#172033] sm:text-4xl md:mt-3 md:text-6xl">
          Post your grind.
          <span class="block text-[#2563EB]">Watch the crew.</span>
        </h1>

        <p class="mt-3 max-w-2xl text-xs font-black uppercase leading-relaxed tracking-wide text-[#6B7280] md:mt-4 md:text-sm">
          Share updates, react to friends and keep the strength community alive.
        </p>
      </div>

      <div class="rounded-[2rem] border border-[#E5E7EB] bg-white p-5 shadow-sm">
        <p class="text-xs font-black uppercase tracking-[0.18em] text-[#6B7280]">
          Feed status
        </p>

        <p class="mt-2 text-3xl font-black uppercase text-[#172033]">
          {{ posts.length }}
        </p>

        <p class="mt-2 text-sm font-bold text-[#6B7280]">
          visible posts
        </p>
      </div>
    </div>
  </div>

  <div *ngIf="actionError" class="sb-panel border-red-200 bg-red-50 p-4">
    <p class="text-sm font-black uppercase text-red-600">
      {{ actionError }}
    </p>
  </div>

  <div *ngIf="actionSuccess" class="sb-panel border-green-200 bg-green-50 p-4">
    <p class="text-sm font-black uppercase text-green-600">
      {{ actionSuccess }}
    </p>
  </div>

  <app-create-post
    [loading]="createLoading"
    (create)="createPost($event)"
  ></app-create-post>

  <div *ngIf="posts.length === 0" class="sb-panel p-6 text-center">
    <p class="text-xs font-black uppercase tracking-[0.18em] text-[#6B7280]">
      No posts yet
    </p>

    <h2 class="mt-2 text-2xl font-black uppercase text-[#172033]">
      Be the first to post.
    </h2>
  </div>

  <app-feed-post-card
  *ngFor="let post of posts; trackBy: trackByPostId"
  [post]="post"
  [currentUserUuid]="currentUserUuid"
  [loading]="isPostBusy(post.id)"
  (like)="likePost($event)"
  (delete)="deletePost($event)"
  (comment)="addComment($event)"
></app-feed-post-card>
</section>
