<div class="w-full max-w-md mx-auto mt-6 p-6 bg-white rounded-xl shadow-md sm:shadow-lg sm:p-8">
  <form [formGroup]="addWorkoutForm!" (ngSubmit)="onSubmit()" class="space-y-5">
    
    <div class="flex flex-col">
      <input
        type="text"
        placeholder="Name of workout"
        formControlName="workoutName"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 text-base sm:text-lg"
      />
      <div
        *ngIf="workoutName?.invalid && (workoutName?.dirty || workoutName?.touched)"
        class="mt-2 text-sm text-red-600"
      >
        Enter name!
      </div>
    </div>

    <!-- Save Button -->
    <button
      type="submit"
      class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-base sm:text-lg transition-colors duration-200"
    >
      Save
    </button>
  </form>
</div>
