<div class="w-full max-w-3xl mx-auto mt-8">
  <div class="overflow-hidden rounded-2xl shadow-lg">
    <table class="min-w-full text-sm sm:text-base border-separate border-spacing-0">
      <thead>
        <tr class="bg-blue-600 text-white">
          <th class="py-3 px-5 text-left font-semibold rounded-tl-2xl">#</th>
          <th class="py-3 px-5 text-left font-semibold">Date</th>
          <th class="py-3 px-5 text-left font-semibold">Killograms</th>
          <th class="py-3 px-5 text-center font-semibold rounded-tr-2xl">Actions</th>
        </tr>
      </thead>

      <tbody class="bg-white">
        <tr
          *ngFor="let tempWorkout of data; let i = index"
          class="border-t border-gray-100 hover:bg-blue-50 transition-all duration-150 ease-in-out"
        >
          <td class="py-4 px-5 text-gray-700 font-medium">{{ i + 1 }}</td>
          <td class="py-4 px-5 text-gray-800">{{ tempWorkout.date }}</td>
          <td class="py-4 px-5 font-semibold text-gray-900">
            {{ tempWorkout.total_tonnage_kg }}
          </td>
          <td class="py-4 px-5 flex justify-center gap-5">
            <a
              (click)="onclick()"
              routerLink="workouts/{{ tempWorkout.id }}"
              title="Check"
              class="text-blue-600 hover:text-blue-800 transform hover:scale-110 transition duration-150"
            >
              <i class="fa-regular fa-clipboard text-lg"></i>
            </a>
            <button
              (click)="deleteWorkout(tempWorkout.id)"
              title="Delete"
              class="text-red-500 hover:text-red-700 transform hover:scale-110 transition duration-150"
            >
              <i class="fa-solid fa-trash-can text-lg"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
