<div class="min-h-screen bg-gray-100 flex flex-col">

  <!-- Navbar -->
  <header class="w-full bg-blue-600 sticky top-0 z-50 shadow-md">
    <app-navbar></app-navbar>
  </header>

  <!-- Main layout -->
  <div class="flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto w-full px-4 py-10 flex-1">

    <!-- LEFT ASIDE -->
    <aside
      *ngIf="!hideAside()"
      class="w-full lg:w-1/3 bg-white rounded-xl shadow-md p-5 border border-gray-100"
    >
      <app-log-in *ngIf="!isLogged()"></app-log-in>
      <app-user-profile *ngIf="isLogged()"></app-user-profile>
    </aside>

    <!-- MAIN ROUTER -->
    <main
      class="flex-1 bg-white rounded-xl shadow-md p-5 border border-gray-100 min-h-[400px]"
    >
      <router-outlet></router-outlet>
    </main>

  </div>

  <!-- FOOTER -->
  <footer class="bg-[#3B5998] text-white shadow-md text-center py-4">
    <p class="text-sm">&copy; 2025 Strong Beton. Всички права запазени.</p>
  </footer>

</div>
